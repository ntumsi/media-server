<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>Media Server</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Media Server</h1>
      <span id="file-count" class="badge">0</span>
    </div>
    <div class="header-right">
      <input type="text" id="search" placeholder="Search files..." autocomplete="off" />
      <button id="btn-upload" class="icon-btn" title="Upload files">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button id="btn-scan" class="icon-btn" title="Re-scan media">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button id="btn-info" class="icon-btn" title="Server info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
    </div>
  </header>

  <nav class="toolbar">
    <div class="filter-bar">
      <button class="filter active" data-type="">All</button>
      <button class="filter" data-type="video">Videos</button>
      <button class="filter" data-type="audio">Audio</button>
      <button class="filter" data-type="image">Images</button>
    </div>
    <div class="toolbar-right">
      <select id="sort-select" title="Sort by">
        <option value="name:asc">Name A-Z</option>
        <option value="name:desc">Name Z-A</option>
        <option value="modified:desc">Newest first</option>
        <option value="modified:asc">Oldest first</option>
        <option value="size:desc">Largest first</option>
        <option value="size:asc">Smallest first</option>
      </select>
      <button id="btn-view-grid" class="icon-btn view-btn active" title="Grid view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button id="btn-view-list" class="icon-btn view-btn" title="List view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
  </nav>

  <!-- Breadcrumb for folder navigation -->
  <nav id="breadcrumb" class="breadcrumb hidden">
    <a href="#" data-path="" class="crumb">Home</a>
  </nav>

  <main id="gallery" class="grid-view"></main>

  <!-- Player Modal -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-player">
      <div class="player-header">
        <h2 id="player-title"></h2>
        <div class="player-actions">
          <button id="player-download" class="icon-btn" title="Download">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="modal-close icon-btn" title="Close (Esc)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="player-container"></div>
      <p id="player-meta"></p>
    </div>
  </div>

  <!-- Info Modal -->
  <div id="info-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Server Info</h2>
        <button class="modal-close icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="info-content"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Upload Files</h2>
        <button class="modal-close icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="upload-zone" id="upload-zone">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>Drop files here or click to browse</p>
        <p class="hint">Videos, audio, and images</p>
        <input type="file" id="upload-input" multiple accept="video/*,audio/*,image/*" />
      </div>
      <div id="upload-progress" class="hidden">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <p id="upload-status">Uploading...</p>
      </div>
    </div>
  </div>

  <!-- Keyboard shortcuts toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
